name: Forum container

on:
  pull_request:
    paths:
      - 'forum/**'
      - '.github/workflows/forum.yml'
  push:
    branches: [main]
    paths:
      - 'forum/**'
      - '.github/workflows/forum.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  notification-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, dom, xml, curl, zip
          ini-values: memory_limit=512M
          tools: composer:2.10.3
          coverage: none
      - name: Check out the same notification fix used by the image
        run: |
          ref=$(sed -n 's/^ARG SUBSCRIBED_COMMIT=//p' forum/Dockerfile)
          test "${#ref}" -eq 40
          git clone https://github.com/vibloteket/subscribed.git /tmp/subscribed
          git -C /tmp/subscribed checkout --detach "$ref"
          test "$(git -C /tmp/subscribed rev-parse HEAD)" = "$ref"
      - name: Test real Flarum notification jobs, API posting and rendered email on SQLite
        working-directory: /tmp/subscribed
        env:
          DB_CONNECTION: sqlite
        run: |
          composer update --with=flarum/core:2.0.2 --no-interaction --prefer-dist --no-progress
          composer test:unit
          composer test:integration
          composer analyse:phpstan

  sqlite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts and Compose example
        run: |
          sh -n forum/entrypoint.sh forum/test-image.sh
          docker compose -f forum/compose.example.yml config --quiet
      - name: Build image
        run: docker build --tag bokfri-forum:test forum
      - name: Test install, HTTP, persistence and backup/restore
        run: sh forum/test-image.sh bokfri-forum:test
