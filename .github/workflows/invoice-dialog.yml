name: Invoice dialog GUI regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/main/java/se/swedsoft/bookkeeping/gui/invoice/**'
      - 'src/test/java/se/swedsoft/bookkeeping/gui/invoice/**'
      - '.github/workflows/invoice-dialog.yml'
      - 'pom.xml'

permissions:
  contents: read

jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test actual dialogs at native and enlarged UI fonts
        shell: bash
        run: |
          set -euo pipefail
          PREFIX=(env)
          if [[ "$RUNNER_OS" == "Linux" ]]; then PREFIX=(xvfb-run -a); fi
          run_case() {
            local label="$1" scale="$2"
            shift 2
            local output="target/invoice-dialog-artifacts/$label"
            mkdir -p "$output"
            "${PREFIX[@]}" mvn -B test -Dtest=SSInvoiceDialogGuiTest,SSInvoiceDialogLayoutTest \
              -Dawt.headless=false "-Dbokfri.invoiceTest.fontScale=$scale" \
              "-Dbokfri.invoiceTest.artifacts=$output" "$@" 2>&1 | tee "$output/test.log"
            cp target/surefire-reports/*SSInvoiceDialog* "$output/"
          }
          for scale in 1 1.25 1.5 2; do
            run_case "native-$scale" "$scale"
          done
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            for scale in 1 2; do
              run_case "metal-$scale" "$scale" \
                -Dbokfri.invoiceTest.laf=javax.swing.plaf.metal.MetalLookAndFeel
              run_case "nimbus-$scale" "$scale" \
                -Dbokfri.invoiceTest.laf=javax.swing.plaf.nimbus.NimbusLookAndFeel
            done
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: invoice-dialog-${{ matrix.os }}
          path: |
            target/invoice-dialog-artifacts/
            target/surefire-reports/*SSInvoiceDialog*
          if-no-files-found: error
